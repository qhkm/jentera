name = "aisar-api"
main = "src/index.ts"
compatibility_date = "2026-08-16"
# postgres.js needs Node built-ins (net, crypto) on Workers.
compatibility_flags = ["nodejs_compat"]

# Keep the workers.dev hostname alive alongside the custom domain.
# Passing --domain once silently DISABLED it, because wrangler defaults
# workers_dev to false as soon as any other route exists — which took
# the API offline for the frontend that was still pointing at it.
workers_dev = true

# Postgres on Neon (ap-southeast-1) via Hyperdrive.
# The connection string embedded in this config uses the non-owner role
# `aisar_app`, not neondb_owner — Postgres silently bypasses row-level
# security for table owners, so an owner connection would leave RLS
# configured and enforcing nothing.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f77c72f8d6614bb0b6955170caadad07"

[vars]
# Comma-separated origins allowed to call this API. Credentialed requests
# need an exact origin match — a wildcard is rejected by the browser when
# credentials: 'include' is set, which is how the session cookie travels.
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173,https://jentera.ai,https://jentera.aisar.ai,https://aisar-next.pages.dev"

# Where magic links point. Must match the Resend sender domain, or the
# email carries a link to a different domain than it came from.
APP_ORIGIN = "https://jentera.ai"

# This Worker's own origin. Google redirects the browser back here, and
# the URI must match one registered on the OAuth client character for
# character — including the /api/auth/google/callback path.
# api.jentera.ai, not the workers.dev name: Google requires the OAuth
# redirect's domain to be an authorized domain on the consent screen,
# and a published app must prove ownership of it in Search Console.
# qhkmdev90.workers.dev is not ours to verify; jentera.ai is.
API_ORIGIN = "https://api.jentera.ai"

# The immutable runner/Hermes/browser bundle requested for newly
# provisioned runtimes. Changing this asks reconciliation to upgrade;
# it must never silently track "latest".
RUNTIME_RELEASE = "2026.08.27-1"
SPRITES_API_ORIGIN = "https://api.sprites.dev"
# Fail closed. Production provisioning additionally requires secure model
# transport and an explicit comma-separated business canary allowlist.
RUNTIME_PROVISIONING_ENABLED = "false"
MODEL_TRANSPORT_READY = "false"
RUNTIME_CANARY_BUSINESS_IDS = ""
RUNTIME_BOOTSTRAP_ENABLED = "false"
RUNTIME_BUNDLE_COMMIT = "24c1abc0c52d080019afd855922b4c2924b81f94"
AISAR_MODEL_PROVIDER = "openrouter"
AISAR_MODEL_BASE = "https://openrouter.ai/api/v1"
AISAR_MODEL_NAME = "deepseek/deepseek-v4-flash-0731"

# Connector credentials are secrets, never vars:
#   npx wrangler secret put META_APP_SECRET
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
# Runtime-provider credentials are also secrets:
#   npx wrangler secret put SPRITES_TOKEN
#   npx wrangler secret put AISAR_MODEL_KEY

# Edge burst brake on the magic-link endpoint, keyed by client IP.
# Refuses before any database or email work, so a flood costs nothing.
# `period` accepts only 10 or 60. The field is `name`, not `binding`.
[[ratelimits]]
name = "AUTH_BURST"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# Workers AI runs the extraction in src/ingest.ts. Chosen over an
# external provider so the feature needs no third-party key; the model
# id is a constant in that file and the call is one function.
[ai]
binding = "AI"

# Durable wake-up signals. runtime_task in Postgres owns status and
# leases; Queue delivery is intentionally treated as at-least-once.
[[queues.producers]]
binding = "RUNTIME_QUEUE"
queue = "aisar-runtime"

[[queues.consumers]]
queue = "aisar-runtime"
max_batch_size = 5
max_batch_timeout = 2
max_retries = 8
retry_delay = 30
dead_letter_queue = "aisar-runtime-dlq"
max_concurrency = 20
