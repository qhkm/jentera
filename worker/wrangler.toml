name = "aisar-api"
main = "src/index.ts"
compatibility_date = "2026-08-16"
# postgres.js needs Node built-ins (net, crypto) on Workers.
# no_handle_cross_request_promise_resolution: db.ts memoizes one postgres.js
# client per isolate (commit d87a2ac). A socket created in one request context
# gets reused by later requests on the same isolate; without this flag the
# runtime cancels those continuations ("Cannot perform I/O on behalf of a
# different request") and webhook DB lookups fail intermittently.
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]

# Keep the workers.dev hostname alive alongside the custom domain.
# Passing --domain once silently DISABLED it, because wrangler defaults
# workers_dev to false as soon as any other route exists — which took
# the API offline for the frontend that was still pointing at it.
workers_dev = true

# Telegram reaches Cloudflare globally, while the authoritative Neon database
# is in AWS Singapore. Most webhook work is database-bound, so run fetch
# handlers beside the database instead of paying intercontinental latency for
# every tenant-scoped query.
[placement]
region = "aws:ap-southeast-1"

# Postgres on Neon (ap-southeast-1) via Hyperdrive.
# The connection string embedded in this config uses the non-owner role
# `aisar_app`, not neondb_owner — Postgres silently bypasses row-level
# security for table owners, so an owner connection would leave RLS
# configured and enforcing nothing.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f77c72f8d6614bb0b6955170caadad07"

# Files the agent hands the owner: reports, spreadsheets, documents. Keys
# are `<business>/<run>/<artifact id>/<name>`; every read goes through
# routes/artifacts.ts, which resolves the row under RLS before the bucket.
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "jentera-artifacts"

# Workers Logs. Without this, invocation-level telemetry (status codes,
# subrequests, exceptions) is not retained and post-incident diagnosis of
# runtime stalls (e.g. 2026-09-03 12:10 clientDisconnected) is guesswork.
[observability]
enabled = true

[vars]
# Comma-separated origins allowed to call this API. Credentialed requests
# need an exact origin match — a wildcard is rejected by the browser when
# credentials: 'include' is set, which is how the session cookie travels.
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173,https://jentera.ai,https://jentera.aisar.ai,https://aisar-jentera.pages.dev"

# Where magic links point. Must match the Resend sender domain, or the
# email carries a link to a different domain than it came from.
APP_ORIGIN = "https://jentera.ai"

# This Worker's own origin. Google redirects the browser back here, and
# the URI must match one registered on the OAuth client character for
# character — including the /api/auth/google/callback path.
# api.jentera.ai, not the workers.dev name: Google requires the OAuth
# redirect's domain to be an authorized domain on the consent screen,
# and a published app must prove ownership of it in Search Console.
# qhkmdev90.workers.dev is not ours to verify; jentera.ai is.
API_ORIGIN = "https://api.jentera.ai"

# The immutable runner/Hermes/browser bundle requested for newly
# provisioned runtimes. Changing this asks reconciliation to upgrade;
# it must never silently track "latest".
RUNTIME_RELEASE = "2026.09.12-3"
RUNTIME_EXPECTED_REGION = "sin"
# Keep a sprite awake this many hours after each dispatch. Launch posture
# was 24 on every plan; since 2026-09-09 it is 0: an idle sprite pauses and
# stops billing, and the first message after a pause pays a wake of roughly
# 15-30 s (docs/reply-latency.md). Unset means 24.
AISAR_KEEPALIVE_GRACE_HOURS = "0"
SPRITES_API_ORIGIN = "https://api.sprites.dev"
# Fail closed. Completing onboarding provisions one isolated runtime for the
# new business only when the complete secure bootstrap chain is configured.
RUNTIME_PROVISIONING_ENABLED = "true"
MODEL_TRANSPORT_READY = "true"
# Global emergency brake. Runtime routing additionally requires the requesting
# business to own a fully bootstrapped, release-matched runtime row.
RUNTIME_EXECUTION_ENABLED = "true"
RUNTIME_BOOTSTRAP_ENABLED = "true"
RUNTIME_BUNDLE_COMMIT = "78fb6397cb0dae251e187dffb6834ec0c73d90cc"
AISAR_MODEL_PROVIDER = "openrouter"
# The UPSTREAM model gateway the proxy forwards to (allowlisted, see
# worker/src/runtime/execution.ts). The credential presented to it is the
# FMCV_UPSTREAM_KEY secret, never a runtime's.
AISAR_MODEL_BASE = "https://router.fmcv.my"
# The base handed to runtimes: this Worker's own model proxy, which verifies
# the derived jentera runtime credentials and enforces the per-rider budget
# (worker/src/fmcv-verifier.ts + routes/model.ts) before forwarding to the
# allowlisted upstream. Absent this var, runtimes would be handed the
# upstream base directly, which fails closed at the provisioning gate.
AISAR_RUNTIME_MODEL_BASE = "https://api.jentera.ai/v1/model"
# MiniMax-M2.7-highspeed and MiniMax-M3 both began returning the router's
# Token Plan 429 on 2026-09-11. deepseek-v4-flash passed direct proxy probes
# while Hermes's route selector still fell back to its configured default.
# Make the working model the default so that fallback cannot select a blocked
# MiniMax route.
AISAR_MODEL_NAME = "deepseek-v4-flash"
AISAR_DEEP_MODEL_NAME = "deepseek-v4-flash"
# A candidate participates in every runtime's live bootstrap smoke, even when
# it receives no customer traffic. Keep this empty while both MiniMax routes
# return the provider's Token Plan 429.
AISAR_CANDIDATE_MODEL_NAMES = ""
# Self-hosted Firecrawl backing Hermes web_extract, on stayflow-vps behind
# nginx and a bearer token (AISAR_EXTRACT_KEY, a secret). Until 2026-09-10 the
# pinned backend was ddgs, which is search-only: web_extract could not read a
# page on any sprite, so the agent drove a browser instead and pulled whole
# page snapshots into the transcript on every research question. Unset this
# and sprites fall back to exactly that.
# Self-hosted Firecrawl backing Hermes web_extract, on stayflow-vps behind
# nginx and a bearer token (AISAR_EXTRACT_KEY, a secret). Before this the
# pinned backend was ddgs, which is search-only: web_extract could not read a
# page on any sprite — it answered "DuckDuckGo (ddgs) is a search-only backend
# and cannot extract URL content" — so the agent drove a browser instead and
# pulled whole page snapshots into the transcript on every research question.
#
# EXTRACT_BASE_B64 is only parseable by a bootstrap that allowlists it, and the
# bootstrap a sprite runs is curled from RUNTIME_BUNDLE_COMMIT. Setting this
# while the pin named a bundle without the `case` arm is what stalled the fleet
# on 2026-09-10; check-transfer-fields.mjs now blocks that as a predeploy hook.
AISAR_EXTRACT_BASE = "https://extract.kitakod.com"
# No tenant override is needed while quick and deep share the working default.
AISAR_QUICK_MODEL_OVERRIDES = ""
# Routines (deterministic reports plus Sprite-backed agent tasks). Canary first.
# Canary: Kitakod Ventures only, 2026-09-09. Empty allowlist = every business.
ROUTINES_ENABLED = "true"
AISAR_ROUTINES_BUSINESS_IDS = "4e8c2593-2af2-494f-b157-fec0295a50b5"
# router.fmcv.my is a separate LiteLLM gateway and therefore uses the FMCV
# AISAR_MODEL_KEY secret. Official OpenRouter keys are never sent to it.
# Connector credentials are secrets, never vars:
#   npx wrangler secret put META_APP_SECRET
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
# Runtime-provider credentials are also secrets:
#   npx wrangler secret put SPRITES_TOKEN
#   npx wrangler secret put AISAR_OPENROUTER_MANAGEMENT_KEY

# Edge burst brake on the magic-link endpoint, keyed by client IP.
# Refuses before any database or email work, so a flood costs nothing.
# `period` accepts only 10 or 60. The field is `name`, not `binding`.
[[ratelimits]]
name = "AUTH_BURST"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# Config channel, keyed by rider id. A sprite fetches at start and on a nudge,
# so 30/60s is far above real use and still a brake if one starts spinning.
[[ratelimits]]
name = "RUNTIME_CONFIG_BURST"
namespace_id = "1006"

  [ratelimits.simple]
  limit = 30
  period = 60

# Broad API brake before session verification, Neon, or any provider call.
# This is intentionally generous enough for normal dashboard bursts. WAF
# rules at api.jentera.ai remain the first line of defence before invocation.
[[ratelimits]]
name = "API_BURST"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 120
  period = 60

# Provisioning can create paid infrastructure, so it gets its own tight
# namespace in addition to the broad API limit and owner/canary gates.
[[ratelimits]]
name = "RUNTIME_MUTATION_BURST"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 3
  period = 60

# Starting an agent run can buy compute and model tokens. This remains
# usable as chat while independently failing closed on limiter failure.
[[ratelimits]]
name = "AGENT_RUN_BURST"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 10
  period = 60

# WebSocket handshakes are long-lived resource admission, not ordinary reads.
# Exact per-run and per-user concurrency caps also live inside the Durable Object.
[[ratelimits]]
name = "RUN_STREAM_BURST"
namespace_id = "1005"

  [ratelimits.simple]
  limit = 12
  period = 60

# Placement spike (2026-09-10): a service binding to this same Worker, so the
# queue consumer (which runs unplaced, in LAX) can ask whether a binding call
# is served at the placed location. Remove with the spike.
[[services]]
binding = "SELF"
service = "aisar-api"

[[durable_objects.bindings]]
name = "RUN_STREAMS"
class_name = "RunStream"

[[migrations]]
tag = "run-stream-v1"
new_sqlite_classes = ["RunStream"]

# Workers AI runs the extraction in src/ingest.ts. Chosen over an
# external provider so the feature needs no third-party key; the model
# id is a constant in that file and the call is one function.
[ai]
binding = "AI"

[[analytics_engine_datasets]]
binding = "PRODUCT_ANALYTICS"
dataset = "jentera_product"

# Durable wake-up signals. runtime_task in Postgres owns status and
# leases; Queue delivery is intentionally treated as at-least-once.
[[queues.producers]]
binding = "RUNTIME_QUEUE"
queue = "aisar-runtime"

[[queues.consumers]]
queue = "aisar-runtime"
# A streamed Hermes task holds one invocation while it relays ephemeral deltas.
# Keep batches at one so a long response cannot head-of-line block four tenants.
max_batch_size = 1
max_batch_timeout = 0
max_retries = 8
retry_delay = 60
dead_letter_queue = "aisar-runtime-dlq"
max_concurrency = 20

# Recover a primary message after its bounded platform retries. The durable
# database lease remains authoritative, so replay after lease expiry is safe.
[[queues.consumers]]
queue = "aisar-runtime-dlq"
max_batch_size = 5
max_batch_timeout = 2
max_retries = 20
retry_delay = 300
max_concurrency = 5

# Fleet drift sweep: every 15 minutes, publish upgrade tasks for sprites not
# on the pinned release (or errored). A release bump then converges by
# itself — no per-business message or operator trigger required.
[triggers]
# */15: fleet drift sweep. * * * * *: owner routines dispatcher (index.ts
# branches on controller.cron, so the sweep never runs every minute).
crons = ["*/15 * * * *", "* * * * *"]
