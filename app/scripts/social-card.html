<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Jentera social preview artwork</title>
  <style>
    @font-face { font-family: Geist; src: url('/sans.woff2') format('woff2'); font-weight: 100 900; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      color: #f5f8f7;
      font-family: Geist, Arial, sans-serif;
      background:
        radial-gradient(circle at 82% 44%, rgba(28, 211, 151, .17), transparent 31%),
        radial-gradient(circle at 10% 8%, rgba(28, 211, 151, .08), transparent 25%),
        #080d0e;
    }
    .grain {
      position: absolute;
      inset: 0;
      opacity: .22;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");
    }
    .brand { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 13px; }
    .brand img { width: 44px; height: 44px; }
    .wordmark { font-size: 29px; font-weight: 650; letter-spacing: -1.7px; }
    .launch { position: absolute; right: 64px; top: 56px; padding: 8px 15px; border: 1px solid #285546; border-radius: 999px; color: #bcebd8; background: #10231d; font-size: 14px; }
    .copy { position: absolute; left: 64px; top: 157px; width: 690px; }
    .eyebrow { color: #65ddb4; font-size: 15px; font-weight: 600; letter-spacing: 2.3px; text-transform: uppercase; }
    h1 { margin: 18px 0 19px; max-width: 690px; font-size: 67px; line-height: .99; font-weight: 670; letter-spacing: -4.2px; }
    .intro { margin: 0; max-width: 625px; color: #a9b5b1; font-size: 21px; line-height: 1.5; letter-spacing: -.25px; }
    .actions { display: flex; align-items: center; gap: 22px; margin-top: 27px; }
    .button { padding: 14px 22px; border-radius: 999px; color: #102019; background: #f1f7f4; font-size: 16px; font-weight: 650; }
    .url { color: #9be6c9; font-size: 16px; }
    .visual { position: absolute; right: 39px; top: 115px; width: 385px; height: 420px; }
    .halo { position: absolute; left: 42px; top: 22px; width: 330px; height: 330px; border: 1px solid rgba(80, 222, 173, .2); border-radius: 50%; background: radial-gradient(circle, rgba(31, 202, 144, .17), rgba(12, 29, 24, .2) 55%, transparent 71%); }
    .mascot { position: absolute; z-index: 2; left: 71px; top: 65px; width: 265px; height: 265px; object-fit: contain; filter: drop-shadow(0 24px 38px rgba(0, 218, 157, .17)); transform: rotate(-3deg); }
    .task { position: absolute; z-index: 3; display: flex; align-items: center; gap: 10px; min-width: 174px; padding: 12px 15px; border: 1px solid #2a4039; border-radius: 15px; color: #d9e4e0; background: rgba(15, 25, 22, .94); box-shadow: 0 14px 32px rgba(0, 0, 0, .24); font-size: 14px; }
    .task::before { content: '✓'; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #091511; background: #4ee0ae; font-weight: 800; }
    .task-one { left: -4px; top: 302px; }
    .task-two { right: 0; top: 348px; }
    .footer { position: absolute; left: 64px; right: 64px; bottom: 43px; padding-top: 18px; border-top: 1px solid #24322f; color: #758681; font-size: 14px; }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="brand"><img src="/mark.svg" alt="" /><span class="wordmark">Jentera</span></div>
  <span class="launch">Jentera is here</span>
  <main class="copy">
    <div class="eyebrow">Your work, moving forward</div>
    <h1>Your AI staff,<br />ready for work.</h1>
    <p class="intro">Give Jentera real work to do. It prepares the work and brings it back for your review.</p>
    <div class="actions"><span class="button">Get started&nbsp; →</span><span class="url">jentera.ai</span></div>
  </main>
  <div class="visual" aria-hidden="true">
    <div class="halo"></div>
    <img class="mascot" src="/mascot.webp" alt="" />
    <div class="task task-one">Research ready</div>
    <div class="task task-two">Draft prepared</div>
  </div>
  <div class="footer">A little help. A lot less busywork.</div>
</body>
</html>
