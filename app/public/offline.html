<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f1f1f" />
    <title>Jentera</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #1f1f1f; color: #e8e6e3; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 28rem; padding: 32px 24px; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0; color: #b5b2ad; }
      button { margin-top: 20px; padding: 10px 18px; border: 1px solid #3a3a3a; border-radius: 10px; background: #262626; color: inherit; font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>You’re offline</h1>
      <p>Jentera needs a connection to reach your business. Your chats are safe; try again when you’re back online.</p>
      <p lang="ms" style="margin-top:8px">Jentera memerlukan sambungan internet. Cuba semula apabila anda kembali dalam talian.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
