<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- The mint spark and hooked smile echo Jentera's existing identity. -->
  <style>
    .eye { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .eye { animation: blink 6.4s ease-in-out 1.4s infinite; }
      .face { animation: glance 9s ease-in-out 2s infinite; }
    }
    @keyframes blink {
      0%, 42%, 46%, 100% { transform: scaleY(1); }
      44% { transform: scaleY(.12); }
    }
    @keyframes glance {
      0%, 55%, 85%, 100% { transform: translate(0, 0); }
      65%, 75% { transform: translate(2px, -1px); }
    }
  </style>
  <path d="M46 17C58 12 76 10 87 16C104 24 110 43 106 65C102 87 86 105 62 108C38 111 19 100 14 80C9 60 16 39 28 29C33 24 39 20 46 17Z" fill="#00D294"/>
  <rect x="15" y="12" width="16" height="16" rx="5" transform="rotate(-12 23 20)" fill="#A4F4CF"/>
  <g class="face">
    <rect class="eye" x="37" y="46" width="11" height="17" rx="5.5" fill="#123B30"/>
    <rect class="eye" x="67" y="42" width="11" height="17" rx="5.5" fill="#123B30"/>
    <path d="M72 71V74C72 82 67 87 60 87C55 87 52 85 50 82" stroke="#123B30" stroke-width="5.5" stroke-linecap="round"/>
  </g>
</svg>
